  spring:
    application:
      name: copa-das-autoras

    profiles:
      active: local

    jpa:
      hibernate:
        ddl-auto: validate

    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 20MB

  management:
    endpoints:
      web:
        exposure:
          include: health,info

    endpoint:
      health:
        show-details: always

  springdoc:
    swagger-ui:
      path: /swagger-ui.html

