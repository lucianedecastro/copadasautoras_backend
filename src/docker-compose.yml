version: "3.8"

services:

  db:
    image: postgres:15
    container_name: copa_postgres
    restart: always

    environment:
      POSTGRES_DB: copa_autoras
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Lu719698022425@

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: copa_app
    depends_on:
      - db

    ports:
      - "8080:8080"

    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: Lu719698022425@
      JWT_SECRET: $2a$10$puvxYjD/XlH5i93WHwCHd.zKBgM0taAUwryTo.VUpnef4HV34oFgC

    restart: always

volumes:
  postgres_data: